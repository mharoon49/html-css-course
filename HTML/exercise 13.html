<!DOCTYPE html>
<html>

  <head>
   <title>Exercise 13</title>
   
   <style>
    body{
      padding-bottom: 200px;
    }
    .div1-body{
      position: relative;
      width: 450px;
      height: 300px;
      border: solid;
      border-width: 1px;
      border-radius: 4px;
      color: grey;
      box-shadow: 3px 3px 5px rgba(172, 171, 171, 0.5);
    }
    .div-X{
      position: absolute;
      top: 5px;
      right: 5px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      padding: 0 5.25px 1px 5.5px;
      border-radius: 30px;
      background-color: black;
      color: white;
      font-weight: bold;
    }
    .div2-body{
      background-color: lightgray;
      position: relative;
      width: 320px;
      height: 180px;
      margin-top: 30px;
      margin-left: 30px;
    }
    .div-x2{
      position:absolute;
      background-color: black;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      border-radius: 40px;  
      padding: 0px 5px 1px 4.75px;  
      top: -7px;
      left: -7px;
    }
    .div-time{
      background-color: black;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      position: absolute;
      bottom: 7px;
      right: 7px;
      font-weight: bold;
      padding: 2px 3px 2px 3px;
      border-radius: 3px;
    }
    .div3-body{
      position: relative;
      box-shadow: 4px 4px 5px rgba(33, 33, 33, 0.5);
      margin-top: 50px;
      margin-left: 30px;
      width: 240px;
      height: 250px;
    }
    .img-shirt{
      height: 250px;
      width: 240px;
      border-radius: 4px;
    }
    .div-shirt{
      position: relative;
    }
    .div-discount{
      position: absolute;
      top: 5px;
      right: 2.5px;
      background-color: white;
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      padding: 2px 3px 2px 3px;
      border-radius: 2px;
      font-weight: 700;
    }
    .div-shirt-but{
      position: absolute;
      bottom: 4.25px;
      right: -0.4px;
      left: -0.4px;
      background-color: white;
      border-radius: 4px;
      border-style: solid;
      border-color: rgba(172, 171, 171);
      border-width: 1px;
      opacity: 0.3;
      height: 50px;
    }
    .but-cart{
      background-color: rgb(255, 215, 57);
      position: absolute;
      bottom: 8.5px;
      right: 79px;
      border: none;
      border-radius: 10px;
      height: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s;
    }
    .but-cart:hover{
      background-color: rgb(255, 169, 57);
    }
    .but-cart:active{
      zoom: 102.5%;
    }
   </style>
  </head>

  <body>
    <div class="div1-body">
     <div class="div-X">x</div>
    </div>

    <div class="div2-body">
      <div class="div-x2">x</div>
      <div class="div-time">15:24</div>
    </div>

    <div class="div3-body">
     <div class="div-shirt"><img class="img-shirt" src="../thumbnails/t-shirt.jpg">
    <div class="div-discount">40% OFF</div>
    <div class="div-shirt-but"></div></div>
    <button class="but-cart">Add to Cart</button>
     
    </div>
  </body>

</html>
