<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 10</title>
    <style>
      .div-main{
        display: grid;
        grid-template-columns: 205px 205px 205px;
        column-gap: 15px;
        margin: 70px auto auto 30px;
        width: 100%;
      }
      .div-A,.div-B,.div-C{
        box-shadow: 3.5px 3.5px 5px rgba(95, 95,95, 0.5);
        height: 400px;
        border-radius: 5px;
      }
      .img-a,.img-b,.img-c{
        width: 205px;
        height: 250px;
        border-radius: 4px;
      }
      .a-name,.b-name,.c-name{
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: bold;
        margin: 6px auto auto 11px;
      }
      .div-a-dpm,.div-b-dpm,.div-c-dpm{
        display: grid;
        margin-top: 15px;
        grid-template-columns: 45px 1fr;
        align-items: center;
        margin-bottom: 15px;
      }
      .img-a-dp,.img-b-dp,.img-c-dp{
        width: 35px;
        height: 35px;
        border-radius: 40px;
      }
      .a-mutuals,.b-mutuals,.c-mutuals{
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13.5px;
        color: rgb(99, 99, 99);
      }
      .but-a,.but-b,.but-c{
        color: white;
        background-color: rgb(12, 102, 237);
        border: none;
        height: 30px;
        width: 75px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: bold;
        margin-left: 50px;
        transition: 0.15s;
      }
      .but-a:hover,.but-b:hover,.but-c:hover{
        background-color: white;
        color: rgb(12, 102, 237);
        border: solid;
        border-width: 1px;
        border-color: rgb(12, 102, 237);
      }
      .but-a:active,.but-b:active,.but-c:active{
        width: 85px;
        background-color: rgb(233, 232, 232);
      }

    </style>

  </head>

  <body>
    <div class="div-main">

      <div class="div-A">
        <div><img class="img-a" src="../thumbnails/man-sitting.jpg" ></div>
        <div>
         <p class="a-name">Peter</p>
        </div>
        <div class="div-a-dpm">
        <div class="a-dp"><img class="img-a-dp" src="../thumbnails/dp nasa.jpg"></div>
        <div>
          <p class="a-mutuals">13 mutual friends</p>
        </div>
        </div> 
         <button class="but-a">Follow</button>
      </div>

      <div class="div-B">
        <div><img class="img-b" src="../thumbnails/man and moon.avif" ></div>
        <div>
         <p class="b-name">David James</p>
        </div>
        <div class="div-b-dpm">
        <div class="b-dp"><img class="img-b-dp" src="../thumbnails/dp sleepy cat.jpg"></div>
        <div>
          <p class="b-mutuals">4 mutual friends</p>
        </div>
        </div> 
         <button class="but-b">Follow</button>
      </div>

      <div class="div-C">
        <div><img class="img-c" src="../thumbnails/man-smoking.jpg" ></div>
        <div>
         <p class="c-name">Oliver</p>
        </div>
        <div class="div-c-dpm">
        <div class="c-dp"><img class="img-c-dp" src="../thumbnails/dp CPU.jpg"></div>
        <div>
          <p class="c-mutuals">8 mutual friends</p>
        </div>
        </div> 
         <button class="but-c">Follow</button>
      </div>



    </div>
  </body>
</html>
